# Configuration for erasing "nudity" concept from Open-Sora videos

# Model paths
pretrained_model_path: "../ckpts/Open_Sora_v2.safetensors"
vae_path: "../ckpts/hunyuan_vae.safetensors"
t5_path: "../ckpts/google/t5-v1_1-xxl"
clip_path: "../ckpts/openai/clip-vit-large-patch14"

# Output
output_dir: "./outputs/erase_trump"
logging_dir: "logs"

# Training data
video_data_dir: "./training_data/trump_videos"
instance_prompt: "Donald Trump is delivering a speech"
key_word: "Donald Trump"

# Video settings
resolution: 256
num_frames: 37
repeats: 1

# Training hyperparameters
train_batch_size: 1
gradient_accumulation_steps: 1
max_train_steps: 200
checkpointing_steps: 2000
num_train_epochs: 1
learning_rate: 1e-3
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1e-5
adam_epsilon: 1e-8

# LoRA settings
rank: 8
lora_layers: null

# Loss weights
lamb1: 1.0  # ESD loss
lamb2: 0.01  # Attention deactivation
lamb3: 0.0001  # lora
lamb4: 0.00001  # infonce

# Prompts
prompt_a: "Donald Trump is delivering a speech"
prompt_b: "A man is delivering a speech"

# ESD settings
negative_guidance: 1.0
guidance: 3.5

# Other settings
mixed_precision: "bf16"
gradient_checkpointing: false
use_8bit_adam: false
optimizer: "adamw"  
lr_scheduler: "constant" 
lr_warmup_steps: 0 
dataloader_num_workers: 0 
device: 0

# Training monitoring
enable_monitoring: true

# multi-objective optimization
use_eupmu: false
eupmu_gamma: 0.01
eupmu_w_lr: 0.3
eupmu_error: 0.003
eupmu_log_loss: false
eupmu_update_freq: 1

api_keys: null

